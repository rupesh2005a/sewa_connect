<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in or create a Seva Connect service provider account." />
  <title>Provider access — Seva Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" crossorigin href="/assets/style-DaZ4Dbe-.css">
</head>
<body class="auth-page">
  <header class="header">
    <div class="container nav-wrap auth-nav">
      <a class="brand" href="sewa.html" aria-label="Seva Connect home">
        <span class="brand-mark">S<span>+</span></span>
        <span class="brand-copy">seva<span>connect</span></span>
      </a>
      <a class="btn btn-ghost" href="auth.html">Customer account</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="providerAuthTitle">
      <div class="auth-mark">↗</div>
      <div class="eyebrow">SERVICE PROVIDER ACCESS</div>
      <h1 id="providerAuthTitle">Join Seva Connect</h1>
      <p class="auth-intro" id="providerAuthIntro">Log in to your provider account or sign up to create one.</p>

      <div class="auth-tabs" role="tablist" aria-label="Provider account access">
        <button class="auth-tab active" id="providerLoginTab" type="button" role="tab" aria-selected="true" aria-controls="providerLoginPanel">Log in</button>
        <button class="auth-tab" id="providerSignupTab" type="button" role="tab" aria-selected="false" aria-controls="providerSignupPanel">Sign up</button>
      </div>

      <div id="providerAuthMessage" class="auth-message" role="alert" hidden></div>

      <form id="providerLoginPanel" class="auth-form active" role="tabpanel" aria-labelledby="providerLoginTab">
        <label>Email address
          <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>Password
          <input name="password" type="password" required autocomplete="current-password" placeholder="Enter your password" />
        </label>
        <button class="btn btn-primary auth-submit" type="submit" disabled>Log in <span aria-hidden="true">→</span></button>
      </form>

      <form id="providerSignupPanel" class="auth-form" role="tabpanel" aria-labelledby="providerSignupTab" hidden>
        <label>Full name
          <input name="fullName" required minlength="2" maxlength="100" autocomplete="name" placeholder="Enter your full name" />
        </label>
        <label>Mobile number
          <input name="mobileNumber" required inputmode="tel" pattern="[0-9+ ()-]{8,16}" autocomplete="tel" placeholder="Enter mobile number" />
        </label>
        <label>Email address
          <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>Password <small>At least 8 characters</small>
          <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Create a password" />
        </label>
        <button class="btn btn-primary auth-submit" type="submit" disabled>Create provider account <span aria-hidden="true">→</span></button>
      </form>

      <p class="auth-note">Provider accounts use Firebase email/password sign-in. Mobile numbers and email addresses are not verified.</p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="provider-auth.js"></script>
</body>
</html>
