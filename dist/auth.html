<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in or create a Seva Connect customer account." />
  <title>Customer access — Seva Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" crossorigin href="/assets/style-DaZ4Dbe-.css">
</head>
<body class="auth-page">
  <header class="header">
    <div class="container nav-wrap auth-nav">
      <a class="brand" href="sewa.html" aria-label="Seva Connect home">
        <span class="brand-mark">S<span>+</span></span>
        <span class="brand-copy">seva<span>connect</span></span>
      </a>
      <a class="btn btn-ghost" href="sewa.html">← Back to Seva Connect</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="authTitle">
      <div class="auth-mark">✦</div>
      <div class="eyebrow">SEVA CONNECT ACCOUNT</div>
      <h1 id="authTitle">Welcome back</h1>
      <p class="auth-intro" id="authIntro">Sign in to your Seva Connect customer account.</p>

      <div class="auth-tabs" role="tablist" aria-label="Customer account access">
        <button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="loginPanel">Log in</button>
        <button class="auth-tab" id="signupTab" type="button" role="tab" aria-selected="false" aria-controls="signupPanel">Sign up</button>
      </div>

      <div id="authMessage" class="auth-message" role="alert" hidden></div>

      <form id="loginPanel" class="auth-form active" role="tabpanel" aria-labelledby="loginTab">
        <label>Email address
          <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>Password
          <input name="password" type="password" required autocomplete="current-password" placeholder="Enter your password" />
        </label>
        <button class="btn btn-primary auth-submit" type="submit">Log in <span aria-hidden="true">→</span></button>
      </form>

      <form id="signupPanel" class="auth-form" role="tabpanel" aria-labelledby="signupTab" hidden>
        <label>Full name
          <input name="fullName" required minlength="2" maxlength="100" autocomplete="name" placeholder="Enter your full name" />
        </label>
        <label>Mobile number
          <input name="mobileNumber" required inputmode="tel" pattern="[0-9+ ()-]{8,16}" autocomplete="tel" placeholder="Enter mobile number" />
        </label>
        <label>Email address
          <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>Password <small>At least 8 characters</small>
          <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Create a password" />
        </label>
        <button class="btn btn-primary auth-submit" type="submit">Create account <span aria-hidden="true">→</span></button>
      </form>

      <section id="signedInPanel" class="signed-in-panel" hidden>
        <span class="signed-in-icon">✓</span>
        <h2>You’re signed in</h2>
        <p id="signedInEmail"></p>
        <button class="btn btn-ghost auth-submit" id="signOutButton" type="button">Sign out</button>
      </section>

      <p class="auth-note">Customer accounts use Firebase email/password sign-in. Mobile numbers and email addresses are not verified.</p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
