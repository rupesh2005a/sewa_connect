<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View your provider services on Seva Connect." />
  <title>Provider dashboard — Seva Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="provider-flow-page">
  <header class="header">
    <div class="container nav-wrap auth-nav provider-flow-nav">
      <a class="brand" href="sewa.html" aria-label="Seva Connect home">
        <span class="brand-mark">S<span>+</span></span>
        <span class="brand-copy">seva<span>connect</span></span>
      </a>
      <div class="provider-flow-account">
        <span id="providerIdentity"></span>
        <button class="btn btn-ghost" id="providerSignOut" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="provider-flow-main">
    <section class="provider-flow-card provider-dashboard-card" aria-labelledby="dashboardTitle">
      <div class="eyebrow">SERVICE PROVIDER</div>
      <h1 id="dashboardTitle">Your dashboard</h1>
      <p class="provider-flow-intro">Your selected services are saved to your Seva Connect provider profile.</p>
      <p id="dashboardStatus" class="provider-flow-status" role="status" aria-live="polite">Loading your provider profile…</p>
      <div id="dashboardError" class="auth-message error" role="alert" hidden></div>
      <div id="dashboardContent" hidden>
        <h2>Your services</h2>
        <ul id="dashboardServices" class="provider-dashboard-services"></ul>
        <a class="btn btn-ghost provider-flow-submit" id="transportDetailsLink" href="transport-provider.html" hidden>Review transport details</a>
        <a class="btn btn-primary provider-flow-submit" id="providerAvailabilityLink" href="provider-availability.html" hidden>Manage transport availability <span aria-hidden="true">→</span></a>
        <a class="btn btn-primary provider-flow-submit" href="provider-services.html">Update services <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="provider-dashboard.js"></script>
</body>
</html>
